apply plugin: 'com.android.application'

android {
    namespace "com.PlushLife"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.PlushLife"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes entirely from environment variables (set as GitHub
    // Actions secrets in .github/workflows/android-release.yml) so the keystore,
    // its password, and the key alias/password never appear in this repo. A
    // local `./gradlew assembleDebug` for day-to-day development doesn't need
    // any of this — only `bundleRelease`/`assembleRelease` read it, and only
    // once those four env vars are actually set.
    def hasReleaseSigning = System.getenv('PLUSHLIFE_KEYSTORE_PATH') != null
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('PLUSHLIFE_KEYSTORE_PATH'))
                storePassword System.getenv('PLUSHLIFE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PLUSHLIFE_KEY_ALIAS')
                keyPassword System.getenv('PLUSHLIFE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    // androidx.activity (added for edge-to-edge support) pulls in androidx.datastore's
    // native shared-counter library transitively. This app never uses Jetpack DataStore
    // directly, and the library's sudden first-time presence made Play Console report
    // 0 supported devices for the release. Excluding it restores the previous (working)
    // zero-native-library state without touching the edge-to-edge fix itself.
    packagingOptions {
        exclude 'lib/*/libdatastore_shared_counter.so'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
