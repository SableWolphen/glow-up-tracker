function formatRelativeTime(isoString) {
  if (!isoString) return "Never yet";
  const diffMs = Date.now() - new Date(isoString).getTime();
  const minutes = Math.floor(diffMs / 60000);
  if (minutes < 1) return "Just now";
  if (minutes < 60) return `${minutes} ${minutes === 1 ? "minute" : "minutes"} ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} ${hours === 1 ? "hour" : "hours"} ago`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days} ${days === 1 ? "day" : "days"} ago`;
  return new Date(isoString).toLocaleDateString();
}

function urlBase64ToUint8Array(value) {
  const padding = "=".repeat((4 - value.length % 4) % 4);
  const base64 = (value + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((character) => character.charCodeAt(0)));
}

function isQuietTime(preferences) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23",
  }).formatToParts(new Date());
  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  const nowMinutes = Number(values.hour) * 60 + Number(values.minute);
  const toMinutes = (value) => {
    const [hour, minute] = String(value || "00:00").split(":").map(Number);
    return hour * 60 + minute;
  };
  const start = toMinutes(preferences.quiet_start);
  const end = toMinutes(preferences.quiet_end);
  return start <= end
    ? nowMinutes >= start && nowMinutes < end
    : nowMinutes >= start || nowMinutes < end;
}

function playCelebrationChime() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const context = new AudioContext();
    const gain = context.createGain();
    gain.gain.setValueAtTime(0.0001, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, context.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.75);
    gain.connect(context.destination);
    [523.25, 659.25, 783.99].forEach((frequency, index) => {
      const oscillator = context.createOscillator();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      oscillator.connect(gain);
      oscillator.start(context.currentTime + index * 0.12);
      oscillator.stop(context.currentTime + 0.5 + index * 0.12);
    });
    window.setTimeout(() => context.close(), 1200);
  } catch (_error) {
    // The visual celebration still works if a browser blocks audio.
  }
}

function trackerPeriod(now = new Date()) {
  const chicagoDate = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago" });
  const date = chicagoDate.format(now);
  const dateAtNoonUtc = new Date(`${date}T12:00:00Z`);
  const monday = new Date(dateAtNoonUtc);
  monday.setUTCDate(monday.getUTCDate() - ((monday.getUTCDay() + 6) % 7));
  return { date, weekStart: monday.toISOString().slice(0, 10) };
}

function dayIdForDate(date) {
  return WEEKDAY_IDS[new Date(`${date}T12:00:00Z`).getUTCDay()];
}

function dateForDayId(dayId, period) {
  if (dayId === "daily") return period.date;
  const dayIndex = DAYS.findIndex((day) => day.id === dayId);
  if (dayIndex < 0) return period.date;
  const date = new Date(`${period.weekStart}T12:00:00Z`);
  date.setUTCDate(date.getUTCDate() + dayIndex);
  return date.toISOString().slice(0, 10);
}

function formatTime12(value24) {
  if (!value24) return "";
  const [hStr, mStr] = value24.split(":");
  let hour = parseInt(hStr, 10);
  if (Number.isNaN(hour)) return "";
  const ampm = hour >= 12 ? "PM" : "AM";
  hour = hour % 12;
  if (hour === 0) hour = 12;
  return `${hour}:${mStr} ${ampm}`;
}

function parseTime24(label12) {
  const match = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((label12 || "").trim());
  if (!match) return "";
  let hour = parseInt(match[1], 10);
  const minute = match[2];
  const ampm = match[3].toUpperCase();
  if (ampm === "PM" && hour !== 12) hour += 12;
  if (ampm === "AM" && hour === 12) hour = 0;
  return `${String(hour).padStart(2, "0")}:${minute}`;
}

function splitScheduleField(value) {
  const trimmed = (value || "").trim();
  const match = /^(\d{1,2}:\d{2}\s*(?:AM|PM))\s*(?:[·\-–]\s*)?(.*)$/i.exec(trimmed);
  if (match) return { time: parseTime24(match[1]), text: match[2] || "" };
  return { time: "", text: trimmed };
}

function legacyScheduleToEntries(schedule) {
  if (!schedule) return [];
  const fields = [
    ["wake", schedule.wake, "Wake up"],
    ["morning", schedule.morning, ""],
    ["work", schedule.work, ""],
    ["workout", schedule.workout, ""],
    ["home", schedule.home, ""],
  ];
  const entries = [];
  fields.forEach(([field, value, fallbackText]) => {
    if (!value) return;
    if (field === "wake") {
      entries.push({ id: `legacy-${field}`, time: parseTime24(value), text: fallbackText });
    } else {
      const split = splitScheduleField(value);
      entries.push({ id: `legacy-${field}`, time: split.time, text: split.text });
    }
  });
  return entries;
}

function habitTypeForTask(task) {
  return (task?.detail || "").match(HABIT_META_PATTERN)?.[1] || "regular";
}

function cleanTaskDetail(detail = "") {
  return detail.replace(HABIT_META_PATTERN, "").trim();
}

function encodeTaskDetail(habitType, detail = "") {
  const cleanDetail = cleanTaskDetail(detail);
  return habitType === "build" || habitType === "reduce"
    ? `[[plushlist-habit:${habitType}]]${cleanDetail ? ` ${cleanDetail}` : ""}`
    : cleanDetail;
}

function offsetDate(date, dayOffset) {
  const value = new Date(`${date}T12:00:00Z`);
  value.setUTCDate(value.getUTCDate() + dayOffset);
  return value.toISOString().slice(0, 10);
}

function daysBetweenDates(earlierDate, laterDate) {
  if (!earlierDate || !laterDate) return null;
  const a = new Date(`${earlierDate}T12:00:00Z`);
  const b = new Date(`${laterDate}T12:00:00Z`);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function taskOccursOn(task, date) {
  if (task.schedule_type === "once") return task.one_time_date === date;
  if (task.schedule_type === "range") {
    if (task.start_date && date < task.start_date) return false;
    if (task.end_date && date > task.end_date) return false;
  }
  return true;
}

function datesThroughToday(period) {
  const dates = [];
  const cursor = new Date(`${period.weekStart}T12:00:00Z`);
  const end = new Date(`${period.date}T12:00:00Z`);
  while (cursor <= end) {
    dates.push(cursor.toISOString().slice(0, 10));
    cursor.setUTCDate(cursor.getUTCDate() + 1);
  }
  return dates;
}

function ToolPanel({ title, onClose, children, inline = false }) {
  useEffect(() => {
    if (inline) return undefined;
    const closeOnEscape = (event) => {
      if (event.key === "Escape") onClose();
    };
    document.addEventListener("keydown", closeOnEscape);
    const previousOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", closeOnEscape);
      document.body.style.overflow = previousOverflow;
    };
  }, [onClose, inline]);

  return (
    <div
      role={inline ? "region" : "dialog"}
      aria-modal={inline ? undefined : "true"}
      aria-label={title}
      onMouseDown={(event) => {
        if (!inline && event.target === event.currentTarget) onClose();
      }}
      style={inline ? { margin: "0 0 18px" } : {
        position: "fixed", inset: 0, zIndex: 2000,
        padding: "max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom))",
        display: "grid", placeItems: "center", background: "rgba(55,38,64,.48)", backdropFilter: "blur(5px)",
      }}
    >
      <div
        onMouseDown={(event) => event.stopPropagation()}
        style={inline ? {
          width: "100%", borderRadius: 22, background: "#FFF9FD", border: "1px solid #E8D5EF",
          boxShadow: "0 10px 28px rgba(62,35,75,.12)",
        } : {
          width: "min(760px,100%)", maxHeight: "calc(100dvh - 24px)", overflowY: "auto",
          borderRadius: 22, background: "#FFF9FD", border: "1px solid #E8D5EF",
          boxShadow: "0 24px 70px rgba(62,35,75,.34)", overscrollBehavior: "contain",
        }}
      >
        <div style={{
          position: "sticky", top: 0, zIndex: 2, display: "flex", justifyContent: "space-between", alignItems: "center",
          gap: 12, padding: "13px 15px", background: "rgba(255,249,253,.96)", borderBottom: "1px solid #E8D5EF",
          backdropFilter: "blur(8px)",
        }}>
          <div style={{ fontSize: 15, fontWeight: 900, color: "#5B4B6B" }}>{title}</div>
          <button type="button" onClick={onClose} aria-label={`Close ${title}`} style={{
            minWidth: 44, minHeight: 38, padding: "7px 11px", borderRadius: 11, border: "1px solid #D9C5E2",
            background: "white", color: "#7A598C", fontWeight: 900, cursor: "pointer",
          }}>{inline ? "Back to tracker" : "Close"}</button>
        </div>
        <div style={{ padding: "14px" }}>{children}</div>
      </div>
    </div>
  );
}

  const addTrackerTask = async () => {
    const task = newTaskName.trim();

      ? newTaskCustomSection.trim()
      : (newTaskSection || newTaskSectionOptions[0] || "My tasks");
    const sectionTasks = trackerTasks.filter((item) => item.day_id === newTaskDay && item.section === section);
    const dayTasks = trackerTasks

    const normalizedDayTasks = [...dayTasks];
    normalizedDayTasks.splice(insertionIndex, 0, row);
    const normalizedWithOrder = normalizedDayTasks.map((item, index) => ({ ...item, sort_order: index + 1 }));
    const orderResults = await Promise.all(normalizedWithOrder
      .filter((item) => item.task_key !== taskKey && Number(dayTasks.find((task) => task.task_key === item.task_key)?.sort_order) !== item.sort_order)

  const [recentlyDeletedTask, setRecentlyDeletedTask] = useState(null);

  const finalizeDeleteTask = async (taskKey) => {
    if (!taskKey) return;
    await supabase.from("tracker_tasks").delete().eq("user_id", user.id).eq("task_key", taskKey);
    await supabase.from("tracker_progress").delete().eq("user_id", user.id).eq("task_key", taskKey);

      delete next[taskKey];
      return next;

    setPendingTaskDelete(null);
    setTaskMessage("");
    if (undoDeleteTimer.current) {
      window.clearTimeout(undoDeleteTimer.current);
      // A previous delete was still waiting to be undone — since we're replacing
      // its toast now, finalize that one for real instead of silently dropping it.
      finalizeDeleteTask(pendingDeleteKey.current);
    }
    pendingDeleteKey.current = taskKey;
    setRecentlyDeletedTask(taskRow ? { ...taskRow, label: taskLabel } : null);
    undoDeleteTimer.current = window.setTimeout(() => {
      setRecentlyDeletedTask(null);
      finalizeDeleteTask(taskKey);

  const moveTrackerTask = async (taskKey, direction) => {
    const originalTasks = [...trackerTasks];
    const target = trackerTasks.find((item) => item.task_key === taskKey);
    if (!target) return;
    const sectionTasks = trackerTasks
      .filter((item) => item.day_id === target.day_id && item.section === target.section)
      .sort((a, b) => a.sort_order - b.sort_order || a.task_key.localeCompare(b.task_key));
    const currentIndex = sectionTasks.findIndex((item) => item.task_key === taskKey);
    const nextIndex = currentIndex + direction;
    if (currentIndex < 0 || nextIndex < 0 || nextIndex >= sectionTasks.length) return;

    const reordered = [...sectionTasks];
    [reordered[currentIndex], reordered[nextIndex]] = [reordered[nextIndex], reordered[currentIndex]];
    const baseOrder = Math.min(...sectionTasks.map((item) => Number(item.sort_order) || 0));
    const orderByKey = Object.fromEntries(reordered.map((item, index) => [item.task_key, baseOrder + index]));
    setTrackerTasks((tasks) => tasks.map((item) => orderByKey[item.task_key] === undefined ? item : { ...item, sort_order: orderByKey[item.task_key] }));
    setTaskMessage("Saving new order…");

    const results = await Promise.all(reordered.map((item) =>
      supabase.from("tracker_tasks")
        .update({ sort_order: orderByKey[item.task_key] })
        .eq("user_id", user.id)
        .eq("task_key", item.task_key)
    ));
    if (results.some(({ error }) => error)) {
      setTrackerTasks(originalTasks);
      setTaskMessage("Couldn't save that order.");
      return;
    }
    setTaskMessage("Task moved ✨");
  };

  const reorderTrackerTask = async (sourceKey, targetKey) => {
    if (!sourceKey || !targetKey || sourceKey === targetKey) return;
    const source = trackerTasks.find((item) => item.task_key === sourceKey);
    const target = trackerTasks.find((item) => item.task_key === targetKey);
    if (!source || !target || source.day_id !== target.day_id || source.section !== target.section) return;
    const originalTasks = [...trackerTasks];
    const sectionTasks = trackerTasks
      .filter((item) => item.day_id === source.day_id && item.section === source.section)
      .sort((a, b) => a.sort_order - b.sort_order || a.task_key.localeCompare(b.task_key));
    const fromIndex = sectionTasks.findIndex((item) => item.task_key === sourceKey);
    const toIndex = sectionTasks.findIndex((item) => item.task_key === targetKey);
    if (fromIndex < 0 || toIndex < 0) return;

    const reordered = [...sectionTasks];
    const [moved] = reordered.splice(fromIndex, 1);
    reordered.splice(toIndex, 0, moved);
    const baseOrder = Math.min(...sectionTasks.map((item) => Number(item.sort_order) || 0));
    const orderByKey = Object.fromEntries(reordered.map((item, index) => [item.task_key, baseOrder + index]));
    setTrackerTasks((tasks) => tasks.map((item) => orderByKey[item.task_key] === undefined ? item : { ...item, sort_order: orderByKey[item.task_key] }));
    setTaskMessage("Saving new order…");

      setTaskMessage("Couldn't save that order.");

    if (!editTaskDraft || !editTaskDraft.task.trim() || !editedSection) {
      setTaskMessage("Task name and section are required.");
      return;
    }
    const originalTask = trackerTasks.find((item) => item.task_key === editingTaskKey);
    const placementChanged = !!originalTask && (originalTask.day_id !== editTaskDraft.day_id || originalTask.section !== editedSection);
    const targetDayTasks = trackerTasks
      .filter((item) => item.day_id === editTaskDraft.day_id && item.task_key !== editingTaskKey)
      .sort((a, b) => Number(a.sort_order) - Number(b.sort_order) || a.task_key.localeCompare(b.task_key));
    const targetSectionLastIndex = targetDayTasks.reduce((lastIndex, item, index) => item.section === editedSection ? index : lastIndex, -1);
    const targetInsertionIndex = targetSectionLastIndex >= 0 ? targetSectionLastIndex + 1 : targetDayTasks.length;
    const changes = {
      task: editTaskDraft.task.trim(),
      detail: encodeTaskDetail(editTaskDraft.habit_type || "regular", editTaskDraft.detail || ""),

      why_note: (editTaskDraft.why_note || "").trim(),
      sort_order: placementChanged ? targetInsertionIndex + 1 : (Number(originalTask?.sort_order) || targetInsertionIndex + 1),
    };
    setTaskMessage("Saving task changes…");
    const { error } = await supabase.from("tracker_tasks").update(changes).eq("user_id", user.id).eq("task_key", editingTaskKey);
    if (error) { setTaskMessage("Couldn't save that task."); return; }
    if (!placementChanged) {
      setTrackerTasks((items) => items.map((item) => item.task_key === editingTaskKey ? { ...item, ...changes } : item));
      setEditingTaskKey(null);
      setEditTaskDraft(null);
      setTaskMessage(`Saved “${changes.task}” ✨`);
      return;
    }
    let reorderedTasks = trackerTasks.map((item) => item.task_key === editingTaskKey ? { ...item, ...changes } : item);
    const affectedDays = [...new Set([originalTask?.day_id, changes.day_id].filter(Boolean))];
    affectedDays.forEach((dayId) => {
      const orderedForDay = reorderedTasks
        .filter((item) => item.day_id === dayId && item.task_key !== editingTaskKey)
        .sort((a, b) => Number(a.sort_order) - Number(b.sort_order) || a.task_key.localeCompare(b.task_key));
      if (dayId === changes.day_id) {
        const editedTask = reorderedTasks.find((item) => item.task_key === editingTaskKey);
        const lastIndex = orderedForDay.reduce((last, item, index) => item.section === editedSection ? index : last, -1);
        orderedForDay.splice(lastIndex >= 0 ? lastIndex + 1 : orderedForDay.length, 0, editedTask);
      }
      const normalized = orderedForDay.map((item, index) => ({ ...item, sort_order: index + 1 }));
      reorderedTasks = [
        ...reorderedTasks.filter((item) => item.day_id !== dayId),
        ...normalized,
      ];
    });
    const orderResults = await Promise.all(reorderedTasks
      .filter((item) => affectedDays.includes(item.day_id))
      .map((item) => supabase
        .from("tracker_tasks")
        .update({ sort_order: item.sort_order })
        .eq("user_id", user.id)
        .eq("task_key", item.task_key)
      )
    );
    if (orderResults.some(({ error: orderError }) => orderError)) {
      setTaskMessage("The task was saved, but its group order needs another try.");
    } else {
      setTaskMessage(`Moved “${changes.task}” into ${editedSection} ✨`);

    setEditTaskDraft(null);

    if (codeCooldown > 0) {
      setSignInMessage(`Please wait ${codeCooldown} seconds before requesting another code.`);
      return;
    }
    setSignInMessage("Sending your one-time code…");
    const { error } = await supabase.auth.signInWithOtp({
      email: address,
      options: {
        shouldCreateUser: true,
        emailRedirectTo: window.location.origin + window.location.pathname,
      },
    });
    if (error) {
      const waitSeconds = Number((error.message || "").match(/after (\d+) seconds/)?.[1]) || 30;
      if (error.status === 429 || /rate limit/i.test(error.message || "")) {
        setCodeCooldown(waitSeconds);
        setSignInMessage(`Please wait ${waitSeconds} seconds, then use the newest code email.`);
      } else {
        setSignInMessage("Couldn't send the code. Please try again.");
      }
      return;
    }
    setCodeCooldown(30);
    setSignInMessage("Code sent! Enter the newest code from your email below.");
  };

      return;

    if (!/^\d{6,8}$/.test(token)) {
      setSignInMessage("Enter the 6–8 digit code from your newest email.");
      return;
    }
    setSignInMessage("Signing you in…");
    let { error } = await supabase.auth.verifyOtp({
      email: address,
      token,
      type: "email",
    });
    if (error) {
      ({ error } = await supabase.auth.verifyOtp({
        email: address,
        token,
        type: "signup",
      }));
    }
    if (error) {
      setSignInMessage("That code didn't work or has expired. Please send a fresh one.");
      return;
    }
    setOtpCode("");
    setSignInMessage("Signed in! This browser will remember you.");

  const isHistoricalView = selectedProgressDate !== period.date;

  const syncNow = async () => {

  const historyByDate = new Map(

  const completedKeysForToday = new Set(Object.keys(done).filter((key) => done[key]));
  const todayDayId = dayIdForDate(period.date);
  const requiredKeysForDate = (date) => {

      .filter((task) =>

  const todayDailyCoreKeys = trackerTasks
    .filter((task) =>

    )

  const todayDailyCoreIsComplete =

  const dayCompletionPct = (date) => {

  const restDatesSet = new Set(restDates);

      const keys = requiredKeysForDate(cursor);
      const completed = habitHistoryByDate.get(cursor) || new Set();
      const isRest = restDatesSet.has(cursor);

                      <button disabled={sectionPosition === 0} onClick={() => moveTrackerTask(r.key, -1)} aria-label={`Move ${r.label} up`} style={{ padding: "5px 8px", borderRadius: 7, border: "1px solid #D6C3E6", background: "#FCF9FF", color: "#8A63A8", cursor: sectionPosition === 0 ? "not-allowed" : "pointer", opacity: sectionPosition === 0 ? 0.35 : 1 }}>↑ Up</button>
                      <button disabled={sectionPosition === sectionRows.length - 1} onClick={() => moveTrackerTask(r.key, 1)} aria-label={`Move ${r.label} down`} style={{ padding: "5px 8px", borderRadius: 7, border: "1px solid #D6C3E6", background: "#FCF9FF", color: "#8A63A8", cursor: sectionPosition === sectionRows.length - 1 ? "not-allowed" : "pointer", opacity: sectionPosition === sectionRows.length - 1 ? 0.35 : 1 }}>↓ Down</button>
                      <button onClick={() => setPendingTaskDelete({ key: r.key, label: r.label, section: r.section })} aria-label={`Delete ${r.label}`} style={{ padding: "5px 8px", borderRadius: 7, border: "1px solid #F0B8C4", background: "#FFF7F9", color: "#C45D74", cursor: "pointer" }}>🗑️ Delete</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}

          {/* Reflection */}
          {day.reflect && (
            <div id="private-reflection-card" style={{ marginTop: 14, padding: "13px 14px", borderRadius: 12, background: day.accent + "12", border: `1px dashed ${day.accent}55` }}>
              <div style={{ fontSize: 10, letterSpacing: "0.2em", color: day.accent, fontWeight: 700, marginBottom: 4 }}>REFLECTION · PRIVATE 🔒</div>
              <div style={{ marginBottom: 5, fontSize: 11.5, color: "#8C6B9E", fontWeight: 800 }}>
                {new Date(`${selectedProgressDate}T12:00:00`).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
              </div>
              <div style={{ fontSize: 14, fontStyle: "italic", color: "#8C6B9E" }}>{reflectionPrompt}</div>
              <div style={{ marginTop: 5, fontSize: 11.5, lineHeight: 1.45, color: "#8C6B9E" }}>Only you can read what you write here. It is never shared with a guardian.</div>
              {lastWeekReflection && (
                <div style={{ marginTop: 9, padding: "10px 12px", borderRadius: 10, background: "rgba(255,255,255,0.55)", border: `1px solid ${day.accent}33` }}>
                  <div style={{ fontSize: 10, letterSpacing: "0.14em", color: day.accent, fontWeight: 800, marginBottom: 4 }}>📮 A LETTER FROM LAST SUNDAY'S YOU</div>
                  <div style={{ fontSize: 12.5, lineHeight: 1.5, color: "#6B5A7D", whiteSpace: "pre-wrap" }}>{lastWeekReflection}</div>
                </div>
              )}
              <textarea value={privateNote} readOnly={isFutureView} onChange={(event) => setPrivateNote(event.target.value)} maxLength={5000} placeholder={isFutureView ? "Reflections unlock on this day." : "Write your private reflection…"} style={{ width: "100%", boxSizing: "border-box", minHeight: 86, marginTop: 9, padding: 10, borderRadius: 10, border: `1px solid ${day.accent}55`, background: isFutureView ? "rgba(245,242,247,0.8)" : "rgba(255,255,255,0.68)", color: "#5B4B6B", resize: "vertical" }} />
              <button onClick={savePrivateNote} disabled={isFutureView} style={{ marginTop: 7, padding: "7px 11px", borderRadius: 9, border: 0, background: day.accent, color: "white", fontWeight: 900, cursor: isFutureView ? "not-allowed" : "pointer", opacity: isFutureView ? 0.5 : 1 }}>{isFutureView ? "Available on this day" : "Save reflection privately 🔒"}</button>
              {privateNoteMessage && <div style={{ marginTop: 7, fontSize: 11.5, color: "#8C6B9E" }}>{privateNoteMessage}</div>}
            </div>
          )}

          {(isHistoricalView ? pct === 100 : todayIsComplete) && (
            <div style={{ textAlign: "center", padding: "12px 0 2px", color: day.accent, fontWeight: 800, fontSize: 15 }}>
              Required care complete — bonus stays optional. Proud of you 💜
            </div>
          )}
        </div>

        </>}


        </>
          </>
        )}
        {user && (
          <footer style={{ marginTop: 22, padding: "20px 10px 6px", textAlign: "center", borderTop: "1px solid #E6D4F2", color: "#8C6B9E", fontSize: 11.5, lineHeight: 1.7 }}>
            <div>© 2026 Sable Johnston · Plushlist™ · All rights reserved.</div>
            <div>
              <a href="./legal.html#privacy" style={{ color: "#9C5FB5" }}>Privacy</a>
              <span aria-hidden="true"> · </span>
              <a href="./legal.html#terms" style={{ color: "#9C5FB5" }}>Terms</a>
              <span aria-hidden="true"> · </span>
              <a href="./legal.html#about" style={{ color: "#9C5FB5" }}>About</a>
            </div>
          </footer>
        )}
      </div>
      </div>
      {recentlyDeletedTask && (
        <div style={{ position: "fixed", left: "50%", bottom: 20, transform: "translateX(-50%)", zIndex: 60, display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderRadius: 12, background: "#3B2E46", color: "white", boxShadow: "0 10px 30px rgba(0,0,0,0.25)", maxWidth: "92vw" }}>
          <span style={{ fontSize: 12.5 }}>🗑️ "{recentlyDeletedTask.label}" removed</span>
          <button type="button" onClick={undoDeleteTask} style={{ padding: "5px 10px", borderRadius: 8, border: "1px solid rgba(255,255,255,0.4)", background: "transparent", color: "#F2D9FF", fontWeight: 900, cursor: "pointer", fontSize: 12.5, whiteSpace: "nowrap" }}>Undo</button>
        </div>
      )}
    </div>
  );
}


class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error("Plushlist crashed:", error, info);
    supabase.auth.getUser().then(({ data }) => {
      supabase.from("app_error_logs").insert({
        user_id: data?.user?.id || null,
        message: String(error?.message || error || "Unknown error").slice(0, 2000),
        stack: String(error?.stack || "").slice(0, 4000),
        url: window.location.href,
      }).then(() => {}, () => {});
    }).catch(() => {});
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "system-ui, sans-serif", textAlign: "center" }}>
          <div style={{ maxWidth: 360 }}>
            <div style={{ fontSize: 40 }}>🧸</div>
            <h1 style={{ fontSize: 18, color: "#5B4B6B", margin: "12px 0 6px" }}>Something went a little sideways</h1>
            <p style={{ fontSize: 13.5, color: "#8C6B9E", lineHeight: 1.5 }}>Plushlist hit a snag. Your data is safe — reloading usually fixes this.</p>
            <button onClick={() => window.location.reload()} style={{ marginTop: 14, padding: "10px 18px", borderRadius: 10, border: 0, background: "#A65DC1", color: "white", fontWeight: 800, cursor: "pointer" }}>Reload Plushlist</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><GlowUpTracker /></AppErrorBoundary>);
