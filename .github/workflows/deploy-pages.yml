name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app tests
        run: npm test

      - name: Build clean Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          cp index.html login.html legal.html oauth.html support.html account-deletion.html _site/
          cp styles.css service-worker.js manifest.webmanifest _site/
          cp icon.svg icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png _site/
          cp social-preview.png social-preview.svg _site/
          cp -R assets _site/assets

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
