name: Update journal preview once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-journal-preview-once.yml'
      - '.github/scripts/update_journal_preview.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update PlushJournal preview
        run: python .github/scripts/update_journal_preview.py
      - name: Commit update
        run: |
          git config user.name "SableWolphen"
          git config user.email "309909614+SableWolphen@users.noreply.github.com"
          git add index.html
          git commit -m "Show PlushJournal prompt and entry preview"
          git push
