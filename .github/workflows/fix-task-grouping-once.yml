name: Fix task grouping once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task-grouping-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make saved task groups control Today headings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'isEveryday: task.day_id === "daily" || (Array.isArray(task.schedule_days) && task.schedule_days.length === 7),'
          new = 'isEveryday: false,'
          if old not in s:
              raise SystemExit('Expected grouping rule not found; refusing to make a blind edit')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "SableWolphen"
          git config user.email "johnston.alexander.k@gmail.com"
          git add index.html
          git commit -m "Respect saved task groups on Today"
          git push
