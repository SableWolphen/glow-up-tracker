name: Upgrade onboarding funnel modes once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-onboarding-funnel-modes-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upgrade onboarding funnel UI
        run: python .github/scripts/upgrade_onboarding_funnel_modes.py
      - name: Validate app source
        run: node scripts/validate-app-source.js
      - name: Commit update
        run: |
          git config user.name "SableWolphen"
          git config user.email "309909614+SableWolphen@users.noreply.github.com"
          git add index.html
          git commit -m "Split onboarding funnel by mode and return status"
          git push
