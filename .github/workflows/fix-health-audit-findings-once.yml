name: Fix health audit findings once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-health-audit-findings-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded cleanup
        run: python scripts/fix-health-audit-findings.py
      - name: Validate app
        run: npm test
      - name: Commit fix
        run: |
          git config user.name "SableWolphen"
          git config user.email "309909614+SableWolphen@users.noreply.github.com"
          git add index.html
          git commit -m "Use Reduce a habit wording consistently"
          git push
