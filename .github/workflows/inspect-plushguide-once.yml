name: Inspect PlushGuide once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-plushguide-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show PlushGuide source context
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          needles = ['Everything you already have, in one place', 'MAKE TODAY FIT', 'PlushGuide does not create new data']
          for needle in needles:
              i = s.find(needle)
              print('\n===', needle, 'index', i, '===')
              if i >= 0:
                  start=max(0, i-7000); end=min(len(s), i+14000)
                  print(s[start:end])
          PY
