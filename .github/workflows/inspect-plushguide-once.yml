name: Validate PlushGuide once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-plushguide-once.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check PlushGuide JavaScript syntax
        run: node --check assets/plush-guide.js
      - name: Run project tests
        run: npm test
