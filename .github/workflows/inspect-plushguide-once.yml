name: Inspect PlushGuide once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-plushguide-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate PlushGuide source
        run: |
          echo '=== files containing PlushGuide-ish text ==='
          grep -RniE 'PLUSHGUIDE|PlushGuide|Everything you already have|MAKE TODAY FIT|PlushGuide does not create|PlushFocus|Change My Tasks' . --exclude-dir=.git --exclude='package-lock.json' | head -n 200 || true
