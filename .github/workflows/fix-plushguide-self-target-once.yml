name: Fix PlushGuide self target once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-plushguide-self-target-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exclude PlushGuide from routing and tour targets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/plush-guide.js')
          s = p.read_text()

          old = '''  function candidates() {\n    return Array.from(document.querySelectorAll('button,a,[role="button"]')).filter(visible);\n  }\n'''
          new = '''  function isGuideUi(node) {\n    return !!(node && node.closest && (node.closest(`#${GUIDE_ID}`) || node.closest(`#${TOUR_ID}`)));\n  }\n\n  function candidates() {\n    return Array.from(document.querySelectorAll('button,a,[role="button"]')).filter((node) => visible(node) && !isGuideUi(node));\n  }\n'''
          if old not in s: raise SystemExit('candidates guard not found')
          s = s.replace(old, new, 1)

          old = '''    const nodes = Array.from(document.querySelectorAll('button,a,[role="button"],h1,h2,h3,h4,label,[aria-label],input,select,textarea')).filter(visible);\n'''
          new = '''    const nodes = Array.from(document.querySelectorAll('button,a,[role="button"],h1,h2,h3,h4,label,[aria-label],input,select,textarea')).filter((node) => visible(node) && !isGuideUi(node));\n'''
          if old not in s: raise SystemExit('tour target guard not found')
          s = s.replace(old, new, 1)

          old = '''  function startTour(featureKey) {\n    window.setTimeout(() => renderTourStep(featureKey, 0), 320);\n  }\n'''
          new = '''  function startTour(featureKey) {\n    const feature = FEATURES[featureKey];\n    let attempts = 0;\n    const waitForDestination = () => {\n      attempts += 1;\n      const firstStep = feature && feature.tour && feature.tour[0];\n      if (firstStep && findTourTarget(firstStep.labels)) {\n        renderTourStep(featureKey, 0);\n        return;\n      }\n      if (attempts < 20) {\n        window.setTimeout(waitForDestination, 120);\n        return;\n      }\n      renderTourStep(featureKey, 0);\n    };\n    window.setTimeout(waitForDestination, 180);\n  }\n'''
          if old not in s: raise SystemExit('startTour guard not found')
          s = s.replace(old, new, 1)

          old = '''  function route(featureKey) {\n    const feature = FEATURES[featureKey];\n    if (!feature) return;\n    closeGuide();\n    window.setTimeout(() => {\n      if (!clickMatching(feature.routeLabels)) {\n        window.alert(feature.fallback || "Open the matching PlushLife section from the navigation or Profile menu.");\n        return;\n      }\n      startTour(featureKey);\n    }, 40);\n  }\n'''
          new = '''  function route(featureKey) {\n    const feature = FEATURES[featureKey];\n    if (!feature) return;\n    closeGuide();\n    window.setTimeout(() => {\n      if (document.getElementById(GUIDE_ID)) closeGuide();\n      if (!clickMatching(feature.routeLabels)) {\n        window.alert(feature.fallback || "Open the matching PlushLife section from the navigation or Profile menu.");\n        return;\n      }\n      startTour(featureKey);\n    }, 90);\n  }\n'''
          if old not in s: raise SystemExit('route guard not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check assets/plush-guide.js
          npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/plush-guide.js
          git diff --cached --quiet && exit 0
          git commit -m "Prevent PlushGuide from targeting itself"
          git push
