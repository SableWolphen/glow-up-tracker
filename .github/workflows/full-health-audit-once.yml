name: Full PlushLife health audit once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-health-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run all project tests
        run: npm test
      - name: Audit interaction wiring
        run: node scripts/full-health-audit.js
      - name: Sync web into Android
        run: npm run android:sync
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug
