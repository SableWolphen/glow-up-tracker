name: Update Habit card once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-habit-card-once.yml'
      - '.github/scripts/update_habit_card.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Habit card and labels
        run: python .github/scripts/update_habit_card.py
      - name: Commit update
        run: |
          git config user.name "SableWolphen"
          git config user.email "309909614+SableWolphen@users.noreply.github.com"
          git add index.html
          git commit -m "Turn schedule preview into Habits Today"
          git push
