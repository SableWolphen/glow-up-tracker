name: Smarten onboarding funnel once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smarten-onboarding-funnel-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update onboarding funnel UI
        run: python .github/scripts/smarten_onboarding_funnel.py
      - name: Commit update
        run: |
          git config user.name "SableWolphen"
          git config user.email "309909614+SableWolphen@users.noreply.github.com"
          git add index.html
          git commit -m "Make onboarding funnel explain drop-offs"
          git push
