name: Fix duplicate My Tasks once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_duplicate_my_tasks.py'
      - '.github/workflows/fix-duplicate-my-tasks-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply repair
        run: python .github/scripts/fix_duplicate_my_tasks.py
      - name: Commit repair
        run: |
          git config user.name "SableWolphen"
          git config user.email "309909614+SableWolphen@users.noreply.github.com"
          git add index.html
          git commit -m "Keep duplicate task sections together"
          git push
