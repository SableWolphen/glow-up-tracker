name: Closed testing PlushRescue 30

on:
  workflow_dispatch: {}
  push:
    branches: [closed-testing-plushrescue-30]

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Run app tests
        run: npm test
      - name: Build www and sync Android
        run: npm run android:sync
      - name: Set release version 30
        working-directory: android/app
        run: |
          sed -i "s/versionCode 1/versionCode 30/" build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.30"/' build.gradle
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build signed AAB
        working-directory: android
        env:
          PLUSHLIFE_KEYSTORE_PATH: release.keystore
          PLUSHLIFE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLUSHLIFE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLUSHLIFE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLUSHLIFE_GIT_SHA: ${{ github.sha }}
        run: ./gradlew bundleRelease
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-30
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Publish to Google Play closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.PlushLife
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore
